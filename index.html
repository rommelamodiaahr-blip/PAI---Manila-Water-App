<main class="shell main"><div class="propertyBar"><label for="propertySelect">📍 Apartment / Property</label><select id="propertySelect" aria-label="Choose apartment"></select></div><section id="entry" class="tabPane active"></section><section id="summary" class="tabPane"></section><section id="tenant" class="tabPane"></section><section id="history" class="tabPane"></section><section id="setup" class="tabPane"></section></main>

<script>
(()=>{'use strict';
const KEY='pai-water-simple-v13',DB='pai-water-simple-v13-db',STORE='state';
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const n=v=>Number.isFinite(Number(v))?Number(v):0;
const c=v=>Math.round((n(v)+Number.EPSILON)*100);const peso=v=>'₱'+(c(v)/100).toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2});
const dec=v=>n(v).toLocaleString('en-PH',{maximumFractionDigits:3});
const uid=()=>crypto?.randomUUID?.()||('id'+Date.now()+Math.random().toString(16).slice(2));
const displayDate=s=>{if(!s)return '—';const m=String(s).match(/^(\d{4})-(\d{2})-(\d{2})/);return m?`${m[3]} ${['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][Number(m[2])-1]} ${m[1]}`:String(s)};
const localDate=()=>{const z=new Date();return `${z.getFullYear()}-${String(z.getMonth()+1).padStart(2,'0')}-${String(z.getDate()).padStart(2,'0')}`};
const blankDraft=()=>({from:'',to:'',due:'',actualM3:'',totalCost:'',previousUnpaid:'0',picture:'',pictureName:'',remarks:'',meters:{}});
const property=(name='Apartment 1')=>({id:uid(),name,address:'',can:'',accountName:'',meterNo:'',tenants:[],draft:blankDraft()});
const seed=()=>{const p=property();return {app:'ahr-manila-water',version:4,selected:p.id,properties:[p],history:[],settings:{shareMode:'equal'}};};
let state=seed(),tab='entry',openHistory=null,editId=null,db=null,persistWarn=false,tenantEditing=null,propertyEditing=null;
const current=()=>state.properties.find(p=>p.id===state.selected)||state.properties[0];
const active=p=>p.tenants.filter(t=>t.active!==false);
const lastReading=(p,tid)=>{const hist=state.history.filter(b=>b.propertyId===p.id).sort((a,b)=>(b.to||'').localeCompare(a.to||''));for(const b of hist){const r=(b.rows||[]).find(r=>r.tid===tid);if(r&&Number.isFinite(Number(r.present)))return Number(r.present);}return n(p.tenants.find(t=>t.id===tid)?.initialReading||0);};
function newDraft(p){const d=blankDraft();for(const t of active(p))d.meters[t.id]={prev:String(lastReading(p,t.id)),present:''};return d;}
function ensure(p){p.tenants??=[];p.draft??=newDraft(p);p.draft.meters??={};p.draft.picture??='';p.draft.previousUnpaid??='0';for(const t of active(p))if(!p.draft.meters[t.id])p.draft.meters[t.id]={prev:String(lastReading(p,t.id)),present:''};return p.draft;}
let pendingPromise=Promise.resolve();function save(){state.version=4;const obj=JSON.parse(JSON.stringify(state));pendingPromise=pendingPromise.catch(()=>{}).then(async()=>{if(db){try{await new Promise((ok,bad)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put(obj,'app');tx.oncomplete=()=>ok();tx.onerror=()=>bad(tx.error);});persistWarn=false;const minimal=JSON.parse(JSON.stringify(obj));for(const p of minimal.properties){p.draft.picture='';}for(const h of minimal.history)h.picture='';try{localStorage.setItem(KEY,JSON.stringify(minimal))}catch{}return;}catch(e){persistWarn=true;}}
try{localStorage.setItem(KEY,JSON.stringify(obj));persistWarn=false}catch(e){persistWarn=true;toast('Storage full. Please download FULL BACKUP in Setup.')}});return pendingPromise;}
function readDb(){return new Promise((ok,bad)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE);r.onsuccess=()=>ok(r.result);r.onerror=()=>bad(r.error)})}
function getDb(){return new Promise((ok,bad)=>{const r=db.transaction(STORE,'readonly').objectStore(STORE).get('app');r.onsuccess=()=>ok(r.result);r.onerror=()=>bad(r.error)})}
async function boot(){let existing=null;try{existing=JSON.parse(localStorage.getItem(KEY)||'null')}catch{}try{db=await readDb();existing=(await getDb())||existing;}catch{db=null}if(validState(existing))state=existing;normalize(state);save();render()}
function validState(v){return !!(v&&Array.isArray(v.properties)&&Array.isArray(v.history)&&v.properties.length&&v.properties.every(p=>p&&Array.isArray(p.tenants)))}
function normalize(s){s.settings??={shareMode:'equal'};s.settings.shareMode??='equal';for(const p of s.properties){p.address??='';p.accountName??='';p.can??='';p.meterNo??='';p.draft??=blankDraft();p.draft.meters??={};p.draft.picture??='';p.draft.previousUnpaid??='0';for(const t of p.tenants){t.initialReading??=0;t.active??=true}}s.selected=s.properties.some(p=>p.id===s.selected)?s.selected:s.properties[0].id;return s;}
function toast(s){const e=document.getElementById('toast');e.textContent=s;e.classList.add('visible');clearTimeout(toast.timeout);toast.timeout=setTimeout(()=>e.classList.remove('visible'),3400)}
function nav(target){tab=target;for(const b of document.querySelectorAll('[data-tab]'))b.classList.toggle('active',b.dataset.tab===target);for(const e of document.querySelectorAll('.tabPane'))e.classList.toggle('active',e.id===target);render();window.scrollTo(0,0)}
function pageTitle(title,sub,label=''){return `<div class="pageIntro"><div><h2>${title}</h2><p class="subtitle">${sub}</p></div>${label?`<span class="pill">${label}</span>`:''}</div>`}
function field(title,key,value,type='text',options=''){return `<div class="field"><label for="e_${key}">${title}</label><input id="e_${key}" data-bill="${key}" type="${type}" ${type==='number'?'min="0" step="any" inputmode="decimal"':''} value="${esc(value??'')}" ${options}></div>`}
function renderEntry(p){const d=ensure(p);return pageTitle('1. Entry','Bill picture or manual billing + submeter readings','STEP 1')+`<div class="card"><div class="cardhead"><h3>Manila Water bill</h3><button class="btn tiny danger" data-action="clearDraft">🗑 Delete / Clear Entry</button></div><div class="account"><b>${esc(p.name)}</b> · ${esc(p.address||'No address yet')}<br>CAN: <b>${esc(p.can||'Not set')}</b> · Account name: ${esc(p.accountName||'Not set')}<br><button class="btn tiny secondary" data-action="openTenant">Edit apartment / CAN</button></div><div class="photozone">${d.picture?`<img src="${d.picture}" alt="Attached Manila Water bill photo"><div class="mutedlink">${esc(d.pictureName||'Saved water bill photo')}</div>`:`<div style="font-size:30px">📷</div><h3>Add a bill picture (optional)</h3><p>Camera or gallery · kept with the saved billing and backup</p>`}<div class="btnline" style="justify-content:center"><button class="btn tiny primary" data-action="camera">📸 Camera</button><button class="btn tiny secondary" data-action="photo">🖼 Upload picture</button>${d.picture?'<button class="btn tiny danger" data-action="deletePhoto">Delete picture</button>':''}</div></div><p class="hint">Picture is stored as a reference, not automatically read. Enter the amounts manually below to ensure accurate sharing.</p><div class="twocol" style="margin-top:15px">${field('Billing period FROM','from',d.from,'date')}${field('Billing period TO','to',d.to,'date')}${field('Payment DUE DATE','due',d.due,'date')}${field('Actual consumption (cu.m / m³)','actualM3',d.actualM3,'number')}${field('TOTAL Manila Water bill (₱)','totalCost',d.totalCost,'number')}${field('Previous unpaid balance (₱)','previousUnpaid',d.previousUnpaid,'number')}</div><div class="notice"><b>Current charges to share = Total bill − Previous unpaid balance.</b><br>Kung walang dating unpaid, ilagay ang <b>0</b>. Hindi awtomatikong kasama sa hatian ang old balance.</div><div class="field"><label>Remarks / reference (optional)</label><textarea class="textarea" data-bill="remarks" placeholder="Invoice number, notes, etc.">${esc(d.remarks)}</textarea></div></div><div class="card"><div class="cardhead"><div><h3>Previous & present water submeter readings</h3><small>Manual input · m³ for each tenant</small></div><span class="pill">${active(p).length} tenants</span></div>${!active(p).length?`<div class="notice warn">Wala pang tenants. Sa Tenant tab, mag-add muna ng tenants at submeter.</div><button class="btn primary full" data-action="openTenant">+ Add tenants</button>`:active(p).map(t=>{const r=d.meters[t.id]||{prev:'',present:''},v=readingUsed(r);return `<div class="meteritem"><div class="meterhead"><div><b>${esc(t.unit||'Unit')} · ${esc(t.name||'Unnamed tenant')}</b><span>Submeter ${esc(t.meterNo||'—')}</span></div><button class="btn tiny danger" data-action="clearReading" data-id="${esc(t.id)}">Delete reading</button></div><div class="metergrid"><div class="field"><label>Previous</label><input type="number" inputmode="decimal" step="any" min="0" data-reading="prev" data-id="${esc(t.id)}" value="${esc(r.prev??'')}"></div><div class="field"><label>Present</label><input type="number" inputmode="decimal" step="any" min="0" data-reading="present" data-id="${esc(t.id)}" value="${esc(r.present??'')}"></div><div class="field"><label>Consumption</label><div class="consump ${v===null?'readonly':''}" id="used_${esc(t.id)}">${v===null?'—':dec(v)+' m³'}</div></div></div></div>`}).join('')}<div class="btnline" style="margin-top:15px"><button class="btn primary grow" data-action="compute">Compute / See Summary →</button><button class="btn secondary" data-action="clearReadings">Clear readings</button></div></div>`;}
function readingUsed(r){if(!r||r.prev===''||r.prev===undefined||r.present===''||r.present===undefined)return null;const a=Number(r.prev),b=Number(r.present);return Number.isFinite(a)&&Number.isFinite(b)&&b>=a&&a>=0?+(b-a).toFixed(3):null}

function printHTML(b,rid){const rows=rid?b.rows.filter(r=>r.tid===rid):b.rows;const title=rid?'INDIVIDUAL TENANT BILL':'TENANT WATER SHARING SUMMARY',tot=rows.reduce((s,r)=>s+r.share,0);const top=`<div class="printTop"><div class="printBrand"><div class="printLogo"><svg viewBox='0 0 64 64' xmlns='http://www.w3.org/2000/svg' aria-hidden='true'><path d='M10 30 32 12l22 18v22a4 4 0 0 1-4 4H14a4 4 0 0 1-4-4Z' fill='#ffffff'/><path d='M24 56V38h16v18' fill='#b8edf2'/><path d='M40.8 16.2 32 9l-8.8 7.2' fill='none' stroke='#b8edf2' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/><path d='M47 43c0 5-4.1 8.6-9.1 8.6S29 48 29 43c0-6.1 8.9-15.2 8.9-15.2S47 36.9 47 43Z' fill='#0aa8b5'/><text x='10' y='53' font-family='Arial, sans-serif' font-size='10' font-weight='700' fill='#0b3147'>AHR</text></svg></div><div><h1>AHR Tenant Water Sharing App</h1><div class="printMeta">Amodia's House Rental · Manila Water tenant statement</div></div></div><div class="printMeta" style="text-align:right">${esc(title)}<br>Billing Due ${displayDate(b.due)}</div></div><div class="printMeta"><b>${esc(b.propertyName||'Apartment')}</b> · ${esc(b.address||'')}<br>CAN: ${esc(b.can||'—')} · Water account name: ${esc(b.accountName||'—')}<br>Billing Period: ${displayDate(b.from)} – ${displayDate(b.to)}</div>`;let contents='';
if(rid&&rows.length){const r=rows[0];contents=`<h2 class="printTitle">${esc(r.unit)} · ${esc(r.name)}</h2><div class="printKV"><span>Previous submeter reading</span><b>${dec(r.previous)} m³</b></div><div class="printKV"><span>Present submeter reading</span><b>${dec(r.present)} m³</b></div><div class="printKV"><span>Consumption</span><b>${dec(r.used)} m³</b></div><div class="printKV"><span>Individual water charge</span><b>${peso(r.base/100)}</b></div><div class="printKV"><span>Shared difference / adjustment</span><b>${peso(r.excess/100)}</b></div><div class="printKV" style="font-size:15pt"><span>TOTAL TO PAY</span><b>${peso(r.share/100)}</b></div>`}else{contents=`<h2 class="printTitle">Tenant computation details</h2><table class="printTable"><thead><tr><th>Unit / Tenant</th><th class="num">Previous</th><th class="num">Present</th><th class="num">Used m³</th><th class="num">Share</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.unit)} · ${esc(r.name)}</td><td class="num">${dec(r.previous)}</td><td class="num">${dec(r.present)}</td><td class="num">${dec(r.used)}</td><td class="num">${peso(r.share/100)}</td></tr>`).join('')}</tbody></table><div class="printKV"><span>Total tenant charges</span><b>${peso(tot/100)}</b></div>`}const footer=`<h2 class="printTitle">Manila Water reference</h2><div class="printKV"><span>Official consumption</span><b>${dec(b.actualM3)} m³</b></div><div class="printKV"><span>Total Manila Water billing</span><b>${peso(b.totalCost)}</b></div><div class="printKV"><span>Previous unpaid (not allocated automatically)</span><b>${peso(b.previousUnpaid)}</b></div><div class="printKV"><span>Current charges for sharing</span><b>${peso(b.currentCost)}</b></div><div class="printKV"><span>Landlord share (if applicable)</span><b>${peso((b.ownerShare||0)/100)}</b></div><p class="printNote">Sharing rule: ${esc(shareLabel[b.method]||b.method)}. This is a tenant sharing statement, not an official Manila Water invoice. Remarks: ${esc(b.remarks||'—')}.</p><div class="printFoot">Saved water billing record · You may choose "Save as PDF" in the Chrome print dialog.</div>`;return top+contents+footer;}
function printSaved(id,tid){const b=state.history.find(h=>h.id===id);if(!b)return toast('Saved record missing.');document.getElementById('printArea').innerHTML=printHTML(b,tid||null);window.print()}
function printDraft(){const x=calc(current());if(!x.isValid)return toast('Complete Entry first.');const b=recordFromCalc(current(),x);document.getElementById('printArea').innerHTML=printHTML(b,null);window.print()}
async function compressPhoto(file){if(!file.type.startsWith('image/'))throw Error('Select an image file.');if(file.size>18*1024*1024)throw Error('Photo exceeds 18MB. Take a smaller picture.');const bitmap=await createImageBitmap(file);const scale=Math.min(1,1550/Math.max(bitmap.width,bitmap.height));const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(bitmap.width*scale));canvas.height=Math.max(1,Math.round(bitmap.height*scale));const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(bitmap,0,0,canvas.width,canvas.height);bitmap.close?.();return canvas.toDataURL('image/jpeg',.78)}
function legacyImport(s){if(['pai-manila-water-full-backup','pai-water-sharing-v13-backup','ahr-water-sharing-v14-backup','ahr-water-sharing-v15-backup'].includes(s?.format))s=s.data;if(!s||!Array.isArray(s.properties))return null;if(Array.isArray(s.history))return s;const out={app:'ahr-manila-water',version:4,selected:s.selected,properties:[],history:[],settings:{shareMode:'proportion'}};for(const q of s.properties){const p={id:q.id||uid(),name:q.name||'Apartment',address:q.address||'',can:q.can||'',accountName:q.accountName||'',meterNo:q.meterNumber||'',tenants:(q.tenants||[]).map(t=>({id:t.id||uid(),unit:t.unit||'Unit',name:t.name||'',meterNo:t.meterId||'',initialReading:0,active:t.active!==false})),draft:blankDraft()};const d=q.draft||{};p.draft={...blankDraft(),from:d.startDate||'',to:d.endDate||'',due:d.dueDate||'',actualM3:d.billedUsage??'',totalCost:d.actualDue??'',previousUnpaid:d.priorUnpaid??'0',picture:d.photoData||'',remarks:d.invoice||'',meters:{}};for(const [tid,r] of Object.entries(d.tenantMeters||{}))p.draft.meters[tid]={prev:r.prev??'',present:r.curr??''};out.properties.push(p);for(const b of q.bills||[]){out.history.push({id:b.id||uid(),propertyId:p.id,propertyName:b.propertyName||p.name,address:b.propertyAddress||p.address,can:b.can||p.can,accountName:b.accountName||p.accountName,meterNo:p.meterNo,from:b.startDate||'',to:b.endDate||'',due:b.dueDate||'',actualM3:n(b.billedUsage),totalCost:n(b.actualDue??b.totalDue),previousUnpaid:n(b.priorUnpaid),currentCost:n(b.currentCharge),picture:b.photoData||'',pictureName:'',remarks:b.invoice||'',method:'proportion',ownerShare:0,rows:(b.rows||[]).map(r=>({tid:r.tid,unit:r.unit,name:r.name,meterNo:r.meterId||'',previous:n(r.prev),present:n(r.curr),used:n(r.used),share:c(r.share),base:c(r.share),excess:0})),savedAt:b.savedAt||new Date().toISOString()})}}out.selected=out.properties.find(p=>p.id===out.selected)?.id||out.properties[0]?.id;return out}
async function restoreFile(file){let raw,restored;try{raw=JSON.parse(await file.text());restored=legacyImport(raw);if(!validState(restored)||!Array.isArray(restored.history)||restored.history.length>25000||restored.properties.length>2000||restored.properties.some(p=>!p.id||!p.name||!p.draft))throw new Error('Invalid backup');normalize(restored)}catch(e){toast('Invalid or unsupported backup JSON file.');return}if(!confirm(`FULL RESTORE ${restored.properties.length} properties and ${restored.history.length} saved bill(s)? This will REPLACE everything currently stored here.`))return;if(!confirm('Final confirmation: ALL current local records will be replaced. Continue?'))return;state=restored;editId=null;openHistory=null;tenantEditing=null;propertyEditing=null;await save();nav('entry');toast('Full restore complete (including photos and History).')}
function action(act,id,button){const p=current(),d=ensure(p);if(act==='openEntry')return nav('entry');if(act==='openTenant')return nav('tenant');if(act==='compute')return nav('summary');if(act==='camera')return document.getElementById('cameraPicker').click();if(act==='photo')return document.getElementById('photoPicker').click();if(act==='deletePhoto'){if(confirm('Delete attached picture from this current Entry?')){d.picture='';d.pictureName='';save();render()}return}if(act==='clearDraft'){if(confirm('Clear ALL input fields and attached picture in this Entry? Saved History remains untouched.')){p.draft=newDraft(p);editId=null;save();render();toast('Entry cleared.')}return}if(act==='clearReading'){if(confirm('Clear previous and present readings for this tenant in the current Entry?')){d.meters[id]={prev:'',present:''};save();render()}return}if(act==='clearReadings'){if(confirm('Clear all readings in this current Entry?')){for(const t of active(p))d.meters[t.id]={prev:'',present:''};save();render()}return}if(act==='saveBill')return saveBill();if(act==='printDraft')return printDraft();if(act==='addProperty'){propertyEditing='new';render();document.getElementById('propertyForm')?.scrollIntoView({block:'center',behavior:'smooth'});return}if(act==='editProperty'){propertyEditing=id;render();document.getElementById('propertyForm')?.scrollIntoView({block:'center',behavior:'smooth'});return}if(act==='closePropertyForm'){propertyEditing=null;render();return}if(act==='selectProperty'){state.selected=id;editId=null;openHistory=null;tenantEditing=null;propertyEditing=null;save();render();return}if(act==='deleteProperty'){if(p.id===id&&state.properties.length===1)return toast('Keep at least one property. Add another property first.');const q=state.properties.find(z=>z.id===id);if(!q)return;const count=state.history.filter(h=>h.propertyId===id).length;if(!confirm(`Delete ${q.name}? This also permanently deletes ${q.tenants.length} tenants and ${count} saved billing(s).`))return;if(count&&!confirm('FINAL confirmation: saved History and bill photos for this property will be lost. Continue?'))return;state.properties=state.properties.filter(z=>z.id!==id);state.history=state.history.filter(h=>h.propertyId!==id);state.selected=state.properties[0].id;openHistory=null;propertyEditing=null;editId=null;save();render();return}if(act==='addTenant'){tenantEditing='new';render();document.getElementById('tenantForm')?.scrollIntoView({block:'center',behavior:'smooth'});return}if(act==='editTenant'){tenantEditing=id;render();document.getElementById('tenantForm')?.scrollIntoView({block:'center',behavior:'smooth'});return}if(act==='closeTenantForm'){tenantEditing=null;render();return}if(act==='deleteTenant'){const t=p.tenants.find(z=>z.id===id);if(!t)return;if(!confirm(`Delete ${t.unit} · ${t.name} from active tenant list? Saved history is retained.`))return;p.tenants=p.tenants.filter(t=>t.id!==id);delete d.meters[id];tenantEditing=null;save();render();return}if(act==='viewHistory'){openHistory=openHistory===id?null:id;render();document.getElementById('historyDetail')?.scrollIntoView({block:'start',behavior:'smooth'});return}if(act==='closeHistory'){openHistory=null;render();return}if(act==='editHistory')return editSaved(id);if(act==='deleteHistory')return deleteSaved(id);if(act==='printHistory')return printSaved(id);if(act==='printTenant')return printSaved(id,button.dataset.tenant);if(act==='backup'){return downloadFile('AHR-Tenant-Water-Sharing-FULL-BACKUP-'+localDate()+'.json',JSON.stringify({format:'ahr-water-sharing-v15-backup',exportedAt:new Date().toISOString(),data:state},null,2),'application/json')}if(act==='restore')return document.getElementById('restorePicker').click();if(act==='reset'){if(!confirm('Delete ALL properties, tenants, pictures, and History on this device? Download a backup first.'))return;if(!confirm('FINAL confirmation: permanently reset the Manila Water app?'))return;state=seed();editId=null;openHistory=null;tenantEditing=null;propertyEditing=null;save();nav('entry');return}}
// event handlers
const root=document;
root.addEventListener('click',e=>{const navButton=e.target.closest('[data-tab]');if(navButton)return nav(navButton.dataset.tab);const btn=e.target.closest('[data-action]');if(btn){e.preventDefault();action(btn.dataset.action,btn.dataset.id,btn)}});
root.addEventListener('input',e=>{const p=current(),d=ensure(p),t=e.target;if(t.matches('[data-bill]')){d[t.dataset.bill]=t.value;save()}else if(t.matches('[data-reading]')){const m=d.meters[t.dataset.id]||={prev:'',present:''};m[t.dataset.reading]=t.value;const view=document.getElementById('used_'+t.dataset.id);if(view){const used=readingUsed(m);view.textContent=used===null?'—':dec(used)+' m³';}save()}});
root.addEventListener('change',e=>{const t=e.target;if(t.id==='propertySelect'){state.selected=t.value;editId=null;openHistory=null;propertyEditing=null;tenantEditing=null;save();render()}if(t.id==='shareMode'){state.settings.shareMode=t.value;save();toast('Computation method updated.')}if(t.id==='photoPicker'||t.id==='cameraPicker'){const file=t.files?.[0];if(!file)return;const propertyId=current().id;compressPhoto(file).then(data=>{const p=state.properties.find(q=>q.id===propertyId);if(!p)return;ensure(p).picture=data;ensure(p).pictureName=file.name;save();if(current().id===propertyId)render();toast('Photo saved with Entry.')}).catch(err=>toast(err.message||'Could not read picture')).finally(()=>t.value='')}if(t.id==='restorePicker'){const file=t.files?.[0];if(file)restoreFile(file).finally(()=>t.value='')}});
root.addEventListener('submit',e=>{const f=e.target;if(f.id==='propertyForm'){e.preventDefault();const data=new FormData(f),id=f.dataset.id,name=String(data.get('name')||'').trim();if(!name)return toast('Enter apartment name.');if(id==='new'){const p=property(name);p.address=String(data.get('address')||'');p.can=String(data.get('can')||'');p.accountName=String(data.get('accountName')||'');p.meterNo=String(data.get('meterNo')||'');state.properties.push(p);state.selected=p.id;}else{const p=state.properties.find(q=>q.id===id);if(!p)return;Object.assign(p,{name,address:String(data.get('address')||''),can:String(data.get('can')||''),accountName:String(data.get('accountName')||''),meterNo:String(data.get('meterNo')||'')});}propertyEditing=null;save();render();toast('Apartment saved.');return}if(f.id==='tenantForm'){e.preventDefault();const data=new FormData(f),id=f.dataset.id,p=current(),unit=String(data.get('unit')||'').trim(),name=String(data.get('name')||'').trim(),base=n(data.get('initialReading'));if(!unit||!name||base<0)return toast('Enter valid unit, name and starting reading.');const vals={unit,name,meterNo:String(data.get('meterNo')||''),initialReading:base,active:data.has('active')};if(id==='new'){const t={id:uid(),...vals};p.tenants.push(t);ensure(p).meters[t.id]={prev:String(base),present:''};}else{const t=p.tenants.find(t=>t.id===id);if(!t)return;Object.assign(t,vals);if(t.active===false){delete p.draft.meters[t.id];}else ensure(p)}tenantEditing=null;save();render();toast('Tenant saved.');return}});

if('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost')){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
// preserve backwards compatible V1.2 backup wrapper and new V1.3 wrapper
const originalLegacy=legacyImport;legacyImport=function(v){if(v?.format==='pai-water-sharing-v13-backup')return v.data;return originalLegacy(v)};
boot();
})();
